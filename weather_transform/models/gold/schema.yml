models:
  - name: fct_weather_hourly
    columns:
      - name: city_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_city')
                field: city_id
      - name: weather_code
        tests:
          - relationships:
              arguments:
                to: ref('dim_weather_code')
                field: weather_code
      - name: relative_humidity_2m_percent
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: precipitation_mm
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, observed_at_utc]

  - name: fct_daily_weather
    columns:
      - name: hours_observed
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 24
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [city_id, date_day]
            
  - name: mart_pipeline_health
    columns:
      - name: run_date
        tests: [not_null, unique]

  - name: vw_dashboard_daily
    columns:
      - name: city_id
        tests: [not_null]
      - name: date_day
        tests: [not_null]

    
    